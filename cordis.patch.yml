# ============================================================================
# dsh-azai —— 阿在
# ============================================================================
# 这个 patch 做两件事：
#
#   1. insert 一行，把 dsh-azai 插件挂进 loader。
#      bundle 的 main 字段不会自动加载，插件必须被 insert 才有 apply()。
#   2. 关掉 system-prompt 原本的身份段。
#
# 安装：把下面两条合并进
#   %USERPROFILE%\.dsh\profiles\<profile>\cordis.patch.yml
# 然后重启 DSH。已有会话不受影响，必须开新会话。
#
# ⚠ 写文件时不能带 UTF-8 BOM，否则 DSH 启动阶段直接崩：
#   DesktopHostFatalError: Unexpected token '锘?, ... is not valid JSON
# ============================================================================

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaSuffix: "Your working directory is the session workspace."

- insert:
    - id: azai-persona
      name: 'dsh-azai'
